<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VideoAnalytics — Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #07090f;
  --surface: #0d1117;
  --surface2: #131a24;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --text: #e8edf5;
  --muted: #5a6a80;
  --muted2: #8a9bb0;
  --accent: #3b82f6;
  --accent-dim: rgba(59,130,246,0.12);
  --accent-glow: rgba(59,130,246,0.25);
  --green: #22c55e;
  --green-dim: rgba(34,197,94,0.12);
  --amber: #f59e0b;
  --amber-dim: rgba(245,158,11,0.12);
  --red: #ef4444;
  --red-dim: rgba(239,68,68,0.12);
  --font: 'DM Sans', sans-serif;
  --mono: 'DM Mono', monospace;
  --radius: 12px;
  --radius-sm: 8px;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.6;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}

/* HEADER */
header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(7,9,15,0.85);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
}
.header-inner {
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 20px;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
}
.logo-icon {
  width: 34px;
  height: 34px;
  background: var(--accent);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.logo-icon svg { width: 16px; height: 16px; fill: #fff; }
.logo-text {
  font-size: 15px;
  font-weight: 500;
  color: var(--text);
  letter-spacing: -0.02em;
}
.logo-ver {
  font-size: 11px;
  color: var(--muted);
  font-weight: 300;
  margin-left: 2px;
}
.btn-dash {
  display: flex;
  align-items: center;
  gap: 7px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  padding: 7px 14px;
  font-family: var(--font);
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  text-decoration: none;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}
.btn-dash:hover { background: var(--surface); border-color: var(--accent); }
.btn-dash svg { width: 14px; height: 14px; fill: var(--accent); }

/* MAIN */
main {
  flex: 1;
  max-width: 1280px;
  width: 100%;
  margin: 0 auto;
  padding: 28px 20px;
}

.layout {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  align-items: start;
}

/* VIDEO PANEL */
.video-panel {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.video-wrap {
  position: relative;
  background: #000;
  border-radius: var(--radius);
  overflow: hidden;
  border: 1px solid var(--border);
  aspect-ratio: 16/9;
}
.video-wrap video {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
}

.video-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
}
.dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--muted);
  flex-shrink: 0;
}
.dot.live { background: var(--green); box-shadow: 0 0 0 3px var(--green-dim); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
.meta-label { font-size: 12px; color: var(--muted2); font-family: var(--mono); }
.meta-id { font-size: 12px; color: var(--muted); margin-left: auto; font-family: var(--mono); }

/* TERMINAL PANEL */
.terminal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-height: 400px;
}

.terminal-header {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.terminal-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--muted2);
}
.terminal-dots { display: flex; gap: 5px; }
.terminal-dots span {
  width: 10px; height: 10px; border-radius: 50%;
}
.d1 { background: #ff5f57; }
.d2 { background: #febc2e; }
.d3 { background: #28c840; }

.buffer-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--amber-dim);
  border: 1px solid rgba(245,158,11,0.2);
  border-radius: 6px;
  padding: 4px 10px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--amber);
  font-weight: 500;
}
.buffer-badge svg { width: 11px; height: 11px; fill: var(--amber); }

.terminal-body {
  flex: 1;
  padding: 16px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-family: var(--mono);
  font-size: 12px;
  line-height: 1.7;
}
.terminal-body::-webkit-scrollbar { width: 4px; }
.terminal-body::-webkit-scrollbar-track { background: transparent; }
.terminal-body::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 10px; }

.log-line {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  padding: 2px 0;
  animation: fadeIn 0.2s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.log-time { color: var(--muted); flex-shrink: 0; }
.log-badge {
  flex-shrink: 0;
  font-size: 9px;
  font-weight: 500;
  padding: 2px 6px;
  border-radius: 4px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  margin-top: 1px;
}
.badge-info { background: var(--accent-dim); color: var(--accent); }
.badge-db { background: var(--green-dim); color: var(--green); }
.badge-buf { background: var(--amber-dim); color: var(--amber); }
.badge-sys { background: rgba(139,92,246,0.12); color: #a78bfa; }
.badge-warn { background: var(--red-dim); color: var(--red); }
.log-msg { color: var(--text); word-break: break-all; }

/* FOOTER */
footer {
  padding: 20px;
  text-align: center;
  font-size: 11px;
  color: var(--muted);
  border-top: 1px solid var(--border);
  font-family: var(--mono);
  letter-spacing: 0.03em;
}

/* RESPONSIVE */
@media (max-width: 768px) {
  .layout { grid-template-columns: 1fr; }
  .terminal { min-height: 320px; }
  main { padding: 16px 14px; }
  .header-inner { padding: 0 14px; }
  .logo-text { font-size: 14px; }
  .btn-dash span { display: none; }
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a class="logo" href="#">
      <div class="logo-icon">
        <svg viewBox="0 0 20 20"><path d="M4 4l12 6-12 6V4z"/></svg>
      </div>
      <span class="logo-text">VideoAnalytics<span class="logo-ver">  v3.0</span></span>
    </a>
    <a href="dashboard.html" target="_blank" class="btn-dash">
      <svg viewBox="0 0 20 20"><rect x="2" y="10" width="4" height="8" rx="1"/><rect x="8" y="6" width="4" height="12" rx="1"/><rect x="14" y="2" width="4" height="16" rx="1"/></svg>
      <span>Dashboard</span>
    </a>
  </div>
</header>

<main>
  <div class="layout">

    <div class="video-panel">
      <div class="video-wrap">
        <video id="video" controls></video>
      </div>
      <div class="video-meta">
        <div class="dot" id="status-dot"></div>
        <span class="meta-label" id="status-label">Idle — awaiting playback</span>
        <span class="meta-id">ID: VDO_001</span>
      </div>
    </div>

    <div class="terminal">
      <div class="terminal-header">
        <div class="terminal-title">
          <div class="terminal-dots">
            <span class="d1"></span><span class="d2"></span><span class="d3"></span>
          </div>
          system.log
        </div>
        <div class="buffer-badge">
          <svg viewBox="0 0 20 20"><path d="M10 2a8 8 0 100 16A8 8 0 0010 2zm0 2a6 6 0 110 12A6 6 0 0110 4zm0 2v4l3 2-1 1.5-3.5-2.2V6H10z"/></svg>
          <span id="live-buffer">Buffer: 0.0s</span>
        </div>
      </div>
      <div class="terminal-body" id="terminal-body"></div>
    </div>

  </div>
</main>

<footer>© 2026 Internal Analytics System &nbsp;·&nbsp; All rights reserved</footer>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
function logToTerminal(message, type = 'info') {
  const terminal = document.getElementById('terminal-body');
  const now = new Date();
  const t = now.toTimeString().split(' ')[0];

  const typeMap = {
    info:   ['badge-info', 'INF'],
    db:     ['badge-db',  'DB'],
    buffer: ['badge-buf', 'BUF'],
    system: ['badge-sys', 'SYS'],
    warn:   ['badge-warn','WRN'],
  };
  const [cls, label] = typeMap[type] || typeMap.info;

  const line = document.createElement('div');
  line.className = 'log-line';
  line.innerHTML = `
    <span class="log-time">${t}</span>
    <span class="log-badge ${cls}">${label}</span>
    <span class="log-msg">${message}</span>
  `;
  terminal.appendChild(line);
  terminal.scrollTop = terminal.scrollHeight;
}

// IndexedDB
const dbName = "VideoAnalyticsDB";
let db;
logToTerminal("Initializing IndexedDB component...", "system");

const request = indexedDB.open(dbName, 1);
request.onupgradeneeded = (e) => {
  db = e.target.result;
  if (!db.objectStoreNames.contains("watch_logs")) {
    const store = db.createObjectStore("watch_logs", { keyPath: "id", autoIncrement: true });
    store.createIndex("videoId", "videoId", { unique: false });
    store.createIndex("sessionId", "sessionId", { unique: false });
  }
};
request.onsuccess = (e) => {
  db = e.target.result;
  logToTerminal("Database connection established.", "system");
};
request.onerror = (e) => { logToTerminal("DB init failed: " + e.target.error, "warn"); };

// Player
const video = document.getElementById('video');
const videoSrc = "https://pub-67264fd15b0f405dbd6a327da60437ba.r2.dev/video-test/playlist.m3u8";

if (Hls.isSupported()) {
  const hls = new Hls();
  hls.loadSource(videoSrc);
  hls.attachMedia(video);
} else if (video.canPlayType('application/vnd.apple.mpegurl')) {
  video.src = videoSrc;
}

// Tracking
const videoId = "VDO_001";
const userId = "User_" + Math.floor(Math.random() * 1000);
function generateUUID() {
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => {
    const r = Math.random() * 16 | 0;
    return (c == 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
}
const sessionId = generateUUID();
logToTerminal(`Session authenticated. User: ${userId}`, "system");
logToTerminal(`Tracking ID: ${sessionId.split('-')[0]}...`, "system");

let accumulatedSeconds = 0, lastTimeUpdate = 0, isPlaying = false;
const dot = document.getElementById('status-dot');
const statusLabel = document.getElementById('status-label');

video.addEventListener('play', () => {
  isPlaying = true;
  lastTimeUpdate = video.currentTime;
  dot.classList.add('live');
  statusLabel.textContent = 'Live — tracking active';
  logToTerminal("Playback started. Tracking initiated.", "info");
});
video.addEventListener('pause', () => {
  isPlaying = false;
  dot.classList.remove('live');
  statusLabel.textContent = 'Paused — tracking suspended';
  logToTerminal("Playback paused.", "info");
});
video.addEventListener('timeupdate', () => {
  if (isPlaying) {
    const curr = video.currentTime;
    const delta = curr - lastTimeUpdate;
    if (delta > 0 && delta <= 1.5) accumulatedSeconds += delta;
    lastTimeUpdate = curr;
    document.getElementById('live-buffer').textContent = `Buffer: ${accumulatedSeconds.toFixed(1)}s`;
  }
});

setInterval(() => {
  if (isPlaying && accumulatedSeconds > 0) {
    logToTerminal(`Buffering payload: ${accumulatedSeconds.toFixed(1)}s accumulated`, "buffer");
  }
}, 4000);

function saveToDatabase(reason = "Scheduled interval") {
  if (accumulatedSeconds <= 0 || !db) return;
  const watchTimeToSave = Math.floor(accumulatedSeconds);
  logToTerminal(`Flushing buffer (${reason}) — writing ${watchTimeToSave}s`, "info");
  accumulatedSeconds = 0;
  document.getElementById('live-buffer').textContent = `Buffer: 0.0s`;
  const tx = db.transaction(["watch_logs"], "readwrite");
  const store = tx.objectStore("watch_logs");
  store.add({ sessionId, userId, videoId, watchTime: watchTimeToSave, timestamp: new Date().toISOString() });
  tx.oncomplete = () => { logToTerminal(`[200 OK] Committed ${watchTimeToSave}s to storage.`, "db"); };
}

setInterval(() => saveToDatabase("10s interval"), 10000);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') {
    logToTerminal("Visibility hidden — flushing buffer...", "warn");
    saveToDatabase("Visibility hidden");
  }
});
</script>
</body>
</html>
